name: Deploy Java API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/devops_bootcamp/JAVA-DEVOPS

            git pull origin main

            docker build -t java-api:v1.0 .

            docker stop java-api || true
            docker rm java-api || true

            docker run -d \
              --name java-api \
              --restart unless-stopped \
              -p 8082:8080 \
              java-api:v1.0

            docker ps
